name: Real Worker

on:
  workflow_call:
    inputs:
      recaf-ref:
        description: Recaf revision; empty selects build.gradle's pinned baseline
        type: string
        default: ""

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Select Recaf revision
        id: revision
        env:
          REQUESTED_RECAF_REF: ${{ inputs.recaf-ref }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          baseline = re.search(r"recafVersion\s*=\s*'([0-9a-f]{40})'", Path('recaf-mcp-plugin/build.gradle').read_text())
          if baseline is None:
              raise SystemExit('Expected a full pinned Recaf commit in build.gradle')
          ref = os.environ['REQUESTED_RECAF_REF'] or baseline.group(1)
          if not re.fullmatch(r'[A-Za-z0-9._/-]+', ref):
              raise SystemExit('Invalid Recaf ref')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'ref={ref}\n')
          PY
      - name: Check out upstream Recaf
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: Col-E/Recaf
          ref: ${{ steps.revision.outputs.ref }}
          path: upstream-recaf
          persist-credentials: false
      - name: Set up build and runtime JDKs
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: |
            22
            25
          cache: gradle
          cache-dependency-path: |
            recaf-mcp-plugin/*.gradle
            upstream-recaf/**/*.gradle
            upstream-recaf/gradle/libs.versions.toml
      - name: Build the generic Recaf JAR at the selected revision
        working-directory: upstream-recaf
        run: ./gradlew assemble -x compileTestJava -Dskip_jfx_bundle=true -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_22_X64 --no-daemon
      - name: Build Worker plugin and resolve test dependencies
        working-directory: recaf-mcp-plugin
        run: ./gradlew build --no-daemon
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.2
        with:
          version: "0.11.25"
          python-version: "3.11"
          working-directory: recaf-mcp-bridge
      - name: Install locked environment
        working-directory: recaf-mcp-bridge
        run: uv sync --frozen
      - name: Verify real Worker lifecycle and tools
        working-directory: recaf-mcp-bridge
        run: |
          uv run --frozen python ../scripts/test_real_worker.py \
            --recaf-jar ../upstream-recaf/recaf-ui/build/libs/recaf-ui-*-all.jar \
            --plugin-jar ../recaf-mcp-plugin/build/libs/recaf-mcp-plugin-*.jar \
            --expected-recaf-commit "$(git -C ../upstream-recaf rev-parse HEAD)"
